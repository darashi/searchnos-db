[package]
name = "searchnos-db"
version = "0.1.0"
edition = "2024"

[dependencies]
lmdb = "0.8.0"
thiserror = "2.0.16"
ndb = { path = "ndb" }
indicatif = "0.18.0"
lmdb-sys = "0.8.0"
clap = { version = "4.5.4", features = ["derive"] }
unicode-normalization = "0.1.23"
rayon = "1.10"
futures-core = "0.3"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
secp256k1 = { version = "0.28", features = ["rand", "serde"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.10"
rand = "0.8"
