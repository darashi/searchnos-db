[package]
name = "searchnos-db"
version = "0.1.0"
edition = "2024"

[dependencies]
lmdb = "0.8.0"
thiserror = "2.0.16"
ndb = { package = "ndb-note-rs", git = "https://github.com/darashi/ndb-note-rs" }
indicatif = "0.18.0"
lmdb-sys = "0.8.0"
clap = { version = "4.5.4", features = ["derive"] }
unicode-normalization = "0.1.23"
serde_json = "1.0"
sha2 = "0.11"
memchr = "2.8"
memmap2 = "0.9"
tracing = "0.1"
fs2 = "0.4"
futures-core = "0.3"
hex = "0.4"
secp256k1 = { version = "0.31", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }
